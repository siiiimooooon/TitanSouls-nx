# The game's armeabi-v7a libraries, in load order (gen_imports.py).
# libTestSuite.so (the game) imports FMOD from libfmodex.so and GameCircle
# from libAmazonGamesJni.so; those bind to each other through the loader,
# not this table.
MODULES libfmodex.so libAmazonGamesJni.so libTestSuite.so

# wchar_t is 32-bit in both bionic and newlib: these agree.
PASSTHROUGH wcstombs
